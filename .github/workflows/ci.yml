# Automatische Tests fuer HU-MultiTenant (Windows PowerShell 5.1) und Releases (Aufbau wie HUMig und HU-AdminTool).
# - bei jedem Push/Pull-Request: Pruefungen (Syntax, BOM, XAML, Steuerelemente, Update-Bibliothek, PSScriptAnalyzer, Pester) - blockierend
#   + Starttest (Main.ps1 -SmokeTest: Fenster oeffnen, 2 s laufen lassen, schliessen) - blockierend
# - Push auf main mit neuer Version (Config/version.json, Tag existiert noch nicht):
#   Vorab-Release v<Version> (Kanal Test) automatisch anlegen, Text aus CHANGELOG.md, HU-MultiTenant-files.sha256 anhaengen
# - von Hand veroeffentlichtes Release: HU-MultiTenant-files.sha256 anhaengen
# - danach jeweils den Update-Weg testen (Pull.ps1 laedt genau dieses Release und prueft alle Pruefsummen)
# - Signatur + Freigabe macht der Herausgeber in HU-MultiTenant (Rechtsklick auf Update > Release signieren / Release freigeben),
#   erst dann wird das Release den Installationen angeboten
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# neuer Push bricht einen noch laufenden Lauf desselben Branches ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruefungen (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Pruefungen
        shell: powershell
        timeout-minutes: 15
        run: .\.github\tests\Invoke-CITests.ps1
      - name: Starttest (Main.ps1 -SmokeTest)
        shell: powershell
        timeout-minutes: 5
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          # Test-Konfiguration: zwei Tenants (ohne Secret), Snippets im alten Format (ohne Beschreibung)
          $s = Get-Content .\Config\settings.example.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $s.tenants[0].tenantId = '11111111-1111-1111-1111-111111111111'; $s.tenants[0].appId = '22222222-2222-2222-2222-222222222222'
          $s.tenants[1].tenantId = '33333333-3333-3333-3333-333333333333'; $s.tenants[1].appId = '44444444-4444-4444-4444-444444444444'
          $s | ConvertTo-Json -Depth 10 | Set-Content .\Config\settings.json -Encoding UTF8
          '{ "snippets": [ { "name": "Geraet [Test]", "code": "Write-Host ok", "created": "2026-01-01 10:00:00" }, { "name": "Zwei", "code": "1+1", "created": "2026-01-02 10:00:00" } ] }' | Set-Content .\Config\quick-snippets.json -Encoding UTF8
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"`"$((Resolve-Path .\Main.ps1).Path)`"",'-ShowConsole','-SmokeTest',"`"$f`"" -PassThru -Wait
          if (-not (Test-Path $f)) { throw "Starttest: kein Ergebnis (Exitcode $($p.ExitCode))" }
          $r = Get-Content $f -Raw
          "Starttest: $r"
          if ($r -notmatch '^OK') { throw "Starttest fehlgeschlagen: $r" }
          "### Starttest: $r" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Protokoll bei Fehler
        if: failure()
        shell: powershell
        run: Get-ChildItem .\Logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }

  release:
    name: Release + Pruefsummen-Datei
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Release bestimmen bzw. als Vorab-Release anlegen
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(python3 -c "import json;print(json.load(open('Config/version.json',encoding='utf-8-sig'))['version'])")
          if [ -z "$V" ]; then echo "Version in Config/version.json nicht gefunden"; exit 1; fi
          T="v$V"
          if gh release view "$T" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $T gibt es schon - nichts anzulegen"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Abschnitt "## v<Version>" aus CHANGELOG.md als Release-Text
          python3 - "$V" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          t = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## v' + re.escape(v) + r'\b[^\n]*\n(.*?)(?=^## v|\Z)', t, re.S | re.M)
          print(m.group(1).strip() if m else 'Version ' + v)
          PY
          gh release create "$T" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "$T" --notes-file notes.md
          echo "Vorab-Release $T angelegt" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
      - name: HU-MultiTenant-files.sha256 erstellen und anhaengen
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          python3 .github/scripts/manifest.py HU-MultiTenant-files.sha256
          gh release upload "$TAG" HU-MultiTenant-files.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Alte Releases entfernen (nur die letzten 10 behalten)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          # neueste zuerst; die aktuelle stabile Version (Latest) bleibt immer erhalten
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q '.[] | "\(.created_at) \(.tag_name)"' | sort -r | awk '{print $2}' > all.txt
          n=0
          while read -r T; do
            n=$((n+1))
            [ "$n" -le "$KEEP" ] && continue
            [ "$T" = "$LATEST" ] && { echo "behalte $T (Latest)"; continue; }
            gh release delete "$T" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "- geloescht: $T" >> "$GITHUB_STEP_SUMMARY"
          done < all.txt

  pull:
    name: Update-Weg testen (Pull.ps1)
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Pull.ps1 laedt das Release und prueft alle Pruefsummen
        shell: powershell
        env:
          HU_GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'HU-MultiTenant'
          $v = $env:TAG -replace '^v', ''
          # Die Signatur haengt der Herausgeber erst nach diesem Test an - hier wird der Weg mit Pruefsumme getestet
          New-Item -ItemType Directory -Path (Join-Path $t 'Config') -Force | Out-Null
          '{ "AllowUnsigned": true }' | Set-Content -LiteralPath (Join-Path $t 'Config\update.json') -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Pull.ps1 -Target $t -Version $v -NoStart -NonInteractive -Owner $env:GITHUB_REPOSITORY_OWNER -Repo ($env:GITHUB_REPOSITORY -split '/')[1]
          if ($LASTEXITCODE -ne 0) { throw "Pull.ps1 Exitcode $LASTEXITCODE" }
          $i = Get-Content (Join-Path $t 'Config\installed.json') -Raw | ConvertFrom-Json
          if ("$($i.Version)" -ne $v) { throw "installiert: $($i.Version), erwartet $v" }
          if ("$($i.Check)" -notlike 'Pruefsumme*') { throw "nicht geprueft: $($i.Check)" }
          "Pull OK: $($i.Version) - $($i.Check) - $($i.Files) Dateien"
          # zweiter Lauf = Update ueber bestehende Installation: veraltete Datei muss weg, Config bleibt, keine Reste
          $old = Join-Path $t 'Core\Alt-Entfernt.ps1'; 'alt' | Set-Content -LiteralPath $old -Encoding UTF8
          $keep = Join-Path $t 'Config\behalten.txt'; 'bleibt' | Set-Content -LiteralPath $keep -Encoding UTF8
          $i.FileList = @($i.FileList) + @('Core/Alt-Entfernt.ps1', 'Config/behalten.txt', '../ausserhalb.txt')
          $i | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $t 'Config\installed.json') -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Pull.ps1 -Target $t -Version $v -NoStart -NonInteractive -Owner $env:GITHUB_REPOSITORY_OWNER -Repo ($env:GITHUB_REPOSITORY -split '/')[1]
          if ($LASTEXITCODE -ne 0) { throw "Pull.ps1 (Update) Exitcode $LASTEXITCODE" }
          if (Test-Path -LiteralPath $old) { throw 'veraltete Datei nicht entfernt' }
          if (-not (Test-Path -LiteralPath $keep)) { throw 'Datei in Config wurde entfernt' }
          $rest = @(Get-ChildItem -LiteralPath $t -Recurse -File -Force | Where-Object { $_.Name -match '\.(pullold|pulltmp)$' -or $_.Name -eq 'pull-journal.json' })
          if ($rest.Count) { throw "Reste: $(($rest | ForEach-Object Name) -join ', ')" }
          $i = Get-Content (Join-Path $t 'Config\installed.json') -Raw | ConvertFrom-Json
          if ("$($i.Version)" -ne $v -or -not @($i.FileList).Count) { throw "installed.json nach Update falsch: $($i.Version)" }
          "Update OK: veraltete Datei entfernt, Config unberuehrt, keine Reste"
